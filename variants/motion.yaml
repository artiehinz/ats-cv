# Focused two-page example. Replace all placeholders with owner-confirmed content.
description: Focused generic resume example. Requires local rendering and owner approval.
max_pages: 2
cv_overrides:
  headline: Your Professional Headline
  social_networks: []
  custom_connections:
  - placeholder: LinkedIn
    url: https://www.linkedin.com/in/your-profile
    fontawesome_icon: linkedin
  - placeholder: GitHub
    url: https://github.com/your-handle
    fontawesome_icon: github
section_overrides:
  Summary:
  - Add a focused, owner-approved summary that explains your role, strengths, collaboration style, and intended direction.
  Skills & Tools:
  - label: Core strengths
    details: Add owner-confirmed strengths relevant to the target role
  - label: Delivery
    details: Add practical workflow, collaboration, and quality practices
  - label: Tools
    details: Add owner-confirmed tools only
section_selections:
  Selected Projects:
    source: Selected Projects
    indices:
    - 0
    - 1
section_order:
- Summary
- Professional Experience
- Selected Projects
- Skills & Tools
- Education
- Languages
- Work Preferences
