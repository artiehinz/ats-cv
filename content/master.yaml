# Generic editable inventory. Replace placeholders with owner-confirmed information.
cv:
  name: Your Name
  location: Your City, Region
  email: you@example.com
  website: https://example.com
  social_networks:
  - network: LinkedIn
    username: your-profile
  - network: GitHub
    username: your-handle
  sections:
    Summary:
    - Add a concise, owner-approved summary of your role, experience, and the value you deliver.
    Core Skills:
    - Add relevant skills, tools, and areas of responsibility supported by your experience.
    Professional Experience:
    - company: Organization One
      position: Current Role
      location: Your City, Region
      date: YYYY – Present
      highlights:
      - Describe an owner-confirmed responsibility, outcome, or collaboration example.
      - Describe a practical workflow or contribution without adding unsupported metrics.
    - company: Organization Two
      position: Previous Role
      location: Another City, Region
      date: YYYY – YYYY
      highlights:
      - Describe relevant experience using clear, factual language.
    Selected Projects:
    - bullet: '[Project One](https://example.com/project-one) – Add a concise, verified project description.'
    - bullet: '[Project Two](https://example.com/project-two) – Add a concise, verified project description.'
    - bullet: '[Project Three](https://example.com/project-three) – Add a concise, verified project description.'
    Tools & Workflows:
    - Use this section for owner-confirmed tools, processes, and collaboration practices.
    Awards & Recognition:
    - Add only verified recognitions and link to public evidence where appropriate.
    Work Preferences:
    - Add owner-confirmed work preferences or authorization details only when current.
    Education:
    - bullet: Add an owner-confirmed program, institution, and completion details.
    Languages:
    - bullet: Add languages and proficiency only when confirmed by the owner.
